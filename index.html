<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบรับส่งไฟล์ข้อสอบออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 flex items-center justify-center">

  <div class="max-w-2xl w-full bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
    
    <div class="bg-gradient-to-r from-blue-900 to-indigo-800 p-8 text-white text-center">
      <div class="inline-flex p-3 bg-white/10 rounded-2xl mb-3 backdrop-blur-sm">
        <svg class="w-8 h-8 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold">ระบบรับส่งไฟล์ข้อสอบออนไลน์</h1>
      <p class="text-blue-200 text-sm mt-1">คณะศิลปศาสตร์ มหาวิทยาลัยเทคโนโลยีราชมงคลรัตนโกสินทร์</p>
    </div>

    <form id="examForm" class="p-8 space-y-6">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">1. เลือกชื่ออาจารย์ผู้สอน <span class="text-rose-500">*</span></label>
        <select id="teacherSelect" onchange="toggleExtraTeacher(this.value)" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all text-slate-700" required>
          <option value="">-- กรุณาเลือกชื่ออาจารย์ --</option>
          <option value="ผู้ช่วยศาสตราจารย์ ดร.จินตนา  ฉัตรบูรภานันท์">1. ผู้ช่วยศาสตราจารย์ ดร.จินตนา  ฉัตรบูรภานันท์</option>
          <option value="ผู้ช่วยศาสตราจารย์ ดร.วัฒนา  แช่มวงษ์">2. ผู้ช่วยศาสตราจารย์ ดร.วัฒนา  แช่มวงษ์</option>
          <option value="ผู้ช่วยศาสตราจารย์ ดร.กัลยา  นามสงวน">3. ผู้ช่วยศาสตราจารย์ ดร.กัลยา  นามสงวน</option>
          <option value="ผู้ช่วยศาสตราจารย์ ดร.กานต์รวี  แพทย์พิทักษ์">4. ผู้ช่วยศาสตราจารย์ ดร.กานต์รวี  แพทย์พิทักษ์</option>
          <option value="อาจารย์วิชชนี  โยเหลา">5. อาจารย์วิชชนี  โยเหลา</option>
          <option value="ดร.มณรดา  ศิลปบรรเลง">6. ดร.มณรดา  ศิลปบรรเลง</option>
          <option value="อาจารย์อภินันท์  ศรีไพวัลย์">7. อาจารย์อภินันท์  ศรีไพวัลย์</option>
          <option value="อาจารย์บุษบง  ทองหนู">8. อาจารย์บุษบง  ทองหนู</option>
          <option value="อาจารย์รมนปวีร์  ชุณห์วิสิทธิกิจ">9. อาจารย์รมนปวีร์  ชุณห์วิสิทธิกิจ</option>
          <option value="ดร.สาธิตา  ศิริวัฒน์">10. ดร.สาธิตา  ศิริวัฒน์</option>
          <option value="OTHER">11. ชื่อเพิ่มเติม (กรอกเอง)</option>
        </select>
        
        <div id="extraTeacherDiv" class="hidden mt-3">
          <input type="text" id="extraTeacherInput" placeholder="กรอก ยศ/ตำแหน่ง ชื่อ-นามสกุล อาจารย์" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all text-slate-700">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">2. รหัสวิชา / ชื่อวิชา <span class="text-rose-500">*</span></label>
        <input type="text" id="subject" placeholder="เช่น GEL 1009 ภาษาอังกฤษสำหรับการสอบวัดมาตรฐาน" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all text-slate-700" required>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">3. จำนวนชุดที่ต้องปริ้น (ชุด/แผ่น) <span class="text-rose-500">*</span></label>
        <input type="number" id="printCopies" min="1" placeholder="เช่น 35" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all text-slate-700" required>
      </div>

      <div class="p-5 border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50 hover:border-blue-400 transition-all">
        <label class="block text-sm font-semibold text-slate-700 mb-2">4. แนบไฟล์ข้อสอบ (รูปแบบ PDF) <span class="text-rose-500">*</span></label>
        <input type="file" id="pdfFile" accept=".pdf" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 transition-all cursor-pointer" required>
      </div>

      <div class="p-5 border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50 hover:border-indigo-400 transition-all">
        <label class="block text-sm font-semibold text-slate-700 mb-2">5. แนบไฟล์ข้อสอบ (รูปแบบ Word - .doc / .docx) <span class="text-rose-500">*</span></label>
        <input type="file" id="wordFile" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 transition-all cursor-pointer" required>
      </div>

      <button type="button" id="submitBtn" onclick="submitExamData()" class="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/20 active:scale-[0.99] transition-all flex items-center justify-center space-x-2">
        <span>ส่งข้อสอบเข้าระบบ</span>
      </button>
    </form>

    <div id="status" class="hidden mx-8 mb-8 p-4 rounded-2xl text-center font-medium text-sm transition-all"></div>
  </div>

  <script>
    // ⚠️ วาง Web App URL จาก Google Apps Script ตรงนี้
    const GAS_WEB_APP_URL = "วาง_WEB_APP_URL_ตรงนี้";

    function toggleExtraTeacher(val) {
      const extraDiv = document.getElementById('extraTeacherDiv');
      const extraInput = document.getElementById('extraTeacherInput');
      if (val === 'OTHER') {
        extraDiv.classList.remove('hidden');
        extraInput.required = true;
      } else {
        extraDiv.classList.add('hidden');
        extraInput.required = false;
        extraInput.value = '';
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({
          fileName: file.name,
          fileType: file.type,
          base64: reader.result.split(',')[1]
        });
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function submitExamData() {
      const teacherSelect = document.getElementById('teacherSelect').value;
      const extraTeacherInput = document.getElementById('extraTeacherInput').value;
      const subject = document.getElementById('subject').value;
      const printCopies = document.getElementById('printCopies').value;
      const pdfInput = document.getElementById('pdfFile').files[0];
      const wordInput = document.getElementById('wordFile').files[0];
      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');

      const teacherName = (teacherSelect === 'OTHER') ? extraTeacherInput.trim() : teacherSelect;

      if (!teacherName || !subject || !printCopies || !pdfInput || !wordInput) {
        alert('กรุณากรอกข้อมูลและแนบไฟล์ให้ครบถ้วนทั้ง PDF และ Word');
        return;
      }

      if (GAS_WEB_APP_URL.includes("วาง_WEB_APP_URL")) {
        alert('กรุณาใส่ GAS_WEB_APP_URL ในโค้ดก่อนใช้งาน');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
      statusDiv.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-700', 'bg-rose-50', 'text-rose-700');
      statusDiv.classList.add('bg-blue-50', 'text-blue-700');
      statusDiv.innerHTML = '⏳ กำลังอัปโหลดไฟล์ PDF และ Word เข้าสู่ระบบ... กรุณารอสักครู่';

      try {
        const pdfData = await fileToBase64(pdfInput);
        const wordData = await fileToBase64(wordInput);

        const payload = {
          teacherName: teacherName,
          subject: subject,
          printCopies: printCopies,
          pdfFileName: pdfData.fileName,
          pdfFileType: pdfData.fileType,
          pdfFileData: pdfData.base64,
          wordFileName: wordData.fileName,
          wordFileType: wordData.fileType,
          wordFileData: wordData.base64
        };

        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const res = await response.json();
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');

        if (res.status === 'success') {
          statusDiv.classList.remove('bg-blue-50', 'text-blue-700');
          statusDiv.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
          statusDiv.innerHTML = '✅ ' + res.message;
          document.getElementById('examForm').reset();
          toggleExtraTeacher('');
        } else {
          statusDiv.classList.remove('bg-blue-50', 'text-blue-700');
          statusDiv.classList.add('bg-rose-50', 'text-rose-700', 'border', 'border-rose-200');
          statusDiv.innerHTML = '❌ ' + res.message;
        }

      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        statusDiv.classList.remove('bg-blue-50', 'text-blue-700');
        statusDiv.classList.add('bg-rose-50', 'text-rose-700', 'border', 'border-rose-200');
        statusDiv.innerHTML = '❌ เกิดข้อผิดพลาดในการส่งข้อมูล: ' + err.message;
      }
    }
  </script>
</body>
</html>
